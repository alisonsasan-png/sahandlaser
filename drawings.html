<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گالری نقشه‌های ابعادی | سهند لیزر</title><style>:root{--navy:#102b43;--cyan:#13a6c4;--bg:#f3f6f8;--line:#dbe4ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17334b;font:16px/1.8 Tahoma,Arial,sans-serif}.hero{background:linear-gradient(125deg,#102b43,#1c4963);color:#fff;padding:34px 20px;border-bottom:4px solid var(--cyan)}.wrap{width:min(1400px,100%);margin:auto;padding:0 20px}.hero h1{margin:0;font-size:clamp(25px,4vw,40px)}.hero p{margin:6px 0;color:#d2e5ee}.toolbar{padding:18px 0;display:flex;gap:8px;flex-wrap:wrap}.button{border:1px solid #cbd8e2;background:#fff;color:#126179;border-radius:10px;padding:7px 13px;cursor:pointer;font:inherit}.button.active{background:#126179;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;padding-bottom:44px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 5px 18px #102b4310}.card img{display:block;width:100%;aspect-ratio:16/10;object-fit:contain;background:#f8fbfd;border-bottom:1px solid var(--line)}.card div{padding:13px 16px}.card span{font-size:13px;color:#126179;background:#e8f7fa;border-radius:999px;padding:2px 9px}.card h2{margin:7px 0 3px;font-size:20px;direction:ltr;text-align:right}.card a{color:#087b96;text-decoration:none;font-weight:bold}.note{margin:16px 0;padding:13px 16px;background:#fff7eb;border:1px solid #ead3a5;border-radius:12px;color:#795b27;font-size:14px}</style></head><body><header class="hero"><div class="wrap"><h1>گالری نقشه‌های ابعادی سهند لیزر</h1><p>نمای کلی، بالا، جانبی و جلو در قالب Art‑Line</p></div></header><main class="wrap"><div class="note">نقشه‌هایی که با عنوان «مرجع اولیه» مشخص شده‌اند، تا زمان دریافت دیتاشیت ابعادی کارخانه، برای تطبیق تصویری و جانمایی اولیه هستند؛ ابعاد درج‌شده در آن‌ها فقط موارد تأییدشده را نشان می‌دهد.</div><nav class="toolbar" aria-label="فیلتر نقشه‌ها"><button class="button active" data-filter="all">همه</button><button class="button" data-filter="دستگاه‌های برش">برش</button><button class="button" data-filter="مارکینگ">مارکینگ</button><button class="button" data-filter="تجهیزات">تجهیزات</button><a class="button" href="catalog.html">بازگشت به کاتالوگ</a></nav><section class="grid"></section></main><script>const bs=[...document.querySelectorAll('[data-filter]')],cs=[...document.querySelectorAll('.card')];bs.forEach(b=>b.onclick=()=>{bs.forEach(x=>x.classList.remove('active'));b.classList.add('active');const f=b.dataset.filter;cs.forEach(c=>c.style.display=f==='all'||c.dataset.cat===f?'':'none')})</script></body></html>
