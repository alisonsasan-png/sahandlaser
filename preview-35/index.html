];
const ring=document.getElementById("ring"),dots=document.getElementById("dots"),carousel=document.getElementById("carousel");let pos=0,drag=false,down=0,last=0;
function detail(t){return t==="slider"?'<div class="detail"><div class="slider"><i></i></div></div>':t==="ring"?'<div class="detail"><div class="ringdetail"></div></div>':t==="cross"?'<div class="detail cross"></div>':'<div class="detail wave"></div>'}
function render(){ring.innerHTML=cards.map((c,i)=>`<article class="card" style="background:${c.bg};--n1:${c.a};--n2:${c.b}" data-i="${i}"><h2>${c.title}</h2><div class="value">${c.value}<span class="unit">${c.unit}</span></div>${detail(c.detail)}<div class="footer">${c.footer}</div></article>`).join("");dots.innerHTML=cards.map((_,i)=>`<i class="${i===mod(pos)?"active":""}"></i>`).join("");layout()}
function mod(n){return (n%cards.length+cards.length)%cards.length}
function layout(){[...ring.children].forEach((el,i)=>{let d=mod(i-pos);if(d>2)d-=4;if(d<-2)d+=4;let x=d*210, z=Math.abs(d)*-100, rot=d*18;el.style.transform=`translate3d(calc(-50% + ${x}px),-50%,${z}px) rotateY(${rot}deg)`;el.style.opacity=Math.abs(d)>1.7?".15":"1";el.style.zIndex=10-Math.abs(d);el.style.filter=Math.abs(d)>1?"blur(3px) brightness(.65)":"none"});[...dots.children].forEach((d,i)=>d.classList.toggle("active",i===mod(pos)))}
function move(n){pos=n;layout()}
function next(){move(pos+1)}function prev(){move(pos-1)}
document.getElementById("next").onclick=next;document.getElementById("prev").onclick=prev;carousel.onkeydown=e=>{if(e.key==="ArrowRight")next();if(e.key==="ArrowLeft")prev()};carousel.onpointerdown=e=>{drag=true;down=e.clientX;last=down;carousel.setPointerCapture(e.pointerId)};carousel.onpointermove=e=>{if(drag&&Math.abs(e.clientX-down)>16){move(pos+(e.clientX<last?1:-1));last=e.clientX}};carousel.onpointerup=()=>drag=false;carousel.onpointercancel=()=>drag=false;render();setInterval(next,4200);
</script></body></html>
