<script>
(function(){
  const id=Number(new URLSearchParams(location.search).get('id'));
  const dest=new URL('./',location.href);

    dest.hash='product=P56-'+String(id).padStart(2,'0');
    location.replace(dest.href);
  }
})();
</script></head><body><p>صفحهٔ محصول اکنون داخل سایت اصلی است. <a href="./#preview56-catalog">مشاهدهٔ محصولات</a></p></body></html>
