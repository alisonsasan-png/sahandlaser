<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CT-005 | پیش‌نمایش محصول</title>
  <style>
    body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f6f8fb;color:#111827}
    main{max-width:1120px;margin:auto;padding:28px 16px}
    .hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:24px;align-items:center}
    .panel{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;box-shadow:0 8px 28px rgba(15,23,42,.06)}
    img{width:100%;height:auto;border-radius:12px;background:#fff;border:1px solid #e5e7eb}
    h1{font-size:clamp(26px,4vw,44px);line-height:1.35;margin:0 0 12px;color:#172554}
    h2{margin:32px 0 12px;color:#172554}
    p{line-height:2;color:#475569}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
    .note{font-size:13px;color:#64748b;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px 12px}
    .badge{display:inline-block;background:#1d4ed8;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;margin-bottom:10px}
    @media(max-width:760px){.hero{grid-template-columns:1fr}main{padding:18px 12px}}
  </style>
</head>
<body>
<main>
  <section class="hero">
    <div class="panel">
      <img src="products/CT-005/images/reference.webp" alt="دستگاه برش لیزر فایبر تک‌میز استاندارد 6020">
    </div>
    <div>
      <span class="badge">CT-005</span>
      <h1>دستگاه برش لیزر فایبر تک‌میز استاندارد 6020</h1>
      <p>پیش‌نمایش موقت محصول با تصاویر روی GitHub. نسخه نهایی بعد از حل آپلود هاست پویاسازان، تصاویر را از هاست خودمان می‌خواند.</p>
      <p class="note">تصاویر فنی، انفجاری و مقطع آموزشی/مفهومی هستند و نقشه ساخت یا CAD مهندسی محسوب نمی‌شوند.</p>
    </div>
  </section>

  <h2>تصاویر محصول</h2>
  <div class="grid">
    <img src="products/CT-005/images/banner.webp" alt="بنر معرفی محصول">
    <img src="products/CT-005/images/technical.webp" alt="نقشه فنی مفهومی">
    <img src="products/CT-005/images/exploded.webp" alt="نمای انفجاری آموزشی">
    <img src="products/CT-005/images/cutaway.webp" alt="نمای مقطع آموزشی">
  </div>
</main>
</body>
</html>
