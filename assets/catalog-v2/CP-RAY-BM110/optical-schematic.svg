<title id="title">نمای عملکردی مسیر اپتیکی BM110</title><desc id="desc">ماژول‌های مستند در دفترچه BM110: رابط فیبر، محافظ بالایی، کولیمیشن، محافظ میانی، فوکوس، محافظ پایینی و نازل. نمودار عملکردی است، نه نقشه موقعیت تمام قطعات داخلی.</desc>
