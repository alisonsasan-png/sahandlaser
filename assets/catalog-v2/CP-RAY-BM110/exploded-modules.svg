<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc"><title id="title">نمای تفکیک ماژول‌های BM110</title><desc id="desc">تفکیک عملکردی شش مجموعه نام‌برده در دفترچه سازنده. ابعاد و فواصل جداسازی نمادین‌اند؛ نمودار مونتاژ پیچ و قطعات ریز نیست.</desc><rect width="1000" height="850" fill="white"/>
