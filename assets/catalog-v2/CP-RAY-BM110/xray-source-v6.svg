<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">نمای داخلی مستندشدهٔ هد برش BM110</title>
  <desc id="desc">عکس واقعی هد BM110 با مسیر اپتیکی شماتیک بر اساس دفترچهٔ سازندهٔ نسخهٔ V2.0. ترتیب ماژول‌ها، سه شیشهٔ محافظ و مجموعه‌های کولیمیشن و فوکوس نشان داده شده‌اند؛ محل و هندسهٔ دقیق قطعات پنهان از این تصویر قابل استنتاج نیست.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#071827" stop-opacity=".08"/><stop offset="1" stop-color="#071827" stop-opacity=".22"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b7fbff"/><stop offset=".5" stop-color="#20d6f2"/><stop offset="1" stop-color="#b7fbff"/></linearGradient>
    <filter id="glow" x="-.8" y="-.1" width="2.6" height="1.2"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-.1" y="-.2" width="1.2" height="1.4"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#00101a" flood-opacity=".35"/></filter>
    <style>
      .fa{font-family:Tahoma,Arial,sans-serif;direction:rtl;unicode-bidi:plaintext}
      .en{font-family:Arial,sans-serif;letter-spacing:.04em}
      .label{font-size:22px;font-weight:700;fill:#fff}
      .detail{font-size:15px;fill:#d4f6fb}
      .num{font:700 18px Arial,sans-serif;fill:#082337}
      .call{fill:none;stroke:#b9f3fa;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .module{fill:#e8fcff;fill-opacity:.88;stroke:#12bfd8;stroke-width:3}
    </style>
  </defs>
  <image x="0" y="0" width="1254" height="1254" preserveAspectRatio="xMidYMid meet" href="studio-web.jpg" xlink:href="studio-web.jpg"/>
  <rect width="1254" height="1254" fill="url(#shade)"/>

  <g filter="url(#shadow)">
    <rect x="24" y="20" width="1206" height="70" rx="16" fill="#09263c" fill-opacity=".94"/>
    <text x="1204" y="51" text-anchor="end" class="fa" font-size="25" font-weight="800" fill="#fff">هد برش BM110 · نمای داخلی مستند</text>
    <text x="1204" y="75" text-anchor="end" class="en" font-size="13" fill="#b6eaf2">RAYTOOLS V2.0 · FUNCTIONAL CUTAWAY · NOT TO SCALE</text>
  </g>

  <!-- Functional optical path only: sequence is sourced; physical positions are schematic. -->
  <path d="M660 105V1025" stroke="#1de0f5" stroke-opacity=".2" stroke-width="28" filter="url(#glow)"/>
  <path d="M660 105V1025" stroke="url(#beam)" stroke-width="5" stroke-dasharray="13 9"/>

  <!-- QBH interface -->
  <g filter="url(#shadow)"><circle cx="660" cy="124" r="27" fill="#c9d5db" stroke="#fff" stroke-width="3"/><circle cx="660" cy="124" r="12" fill="#153a54" stroke="#44d8ec" stroke-width="3"/></g>
  <!-- Three documented cover windows; dimensions are catalogued, not positioned to scale. -->
  <g filter="url(#shadow)">
    <rect class="module" x="623" y="257" width="74" height="12" rx="5"/>
    <rect class="module" x="623" y="568" width="74" height="12" rx="5"/>
    <rect class="module" x="623" y="871" width="74" height="12" rx="5"/>
  </g>
  <!-- Compound collimation and focus lens groups (number of lenses shown schematically). -->
  <g filter="url(#shadow)">
    <path class="module" d="M619 369Q660 343 701 369Q660 395 619 369Z"/>
    <path class="module" d="M619 401Q660 427 701 401Q660 375 619 401Z"/>
    <path class="module" d="M619 679Q660 653 701 679Q660 705 619 679Z"/>
    <path class="module" d="M619 711Q660 737 701 711Q660 685 619 711Z"/>
    <path d="M660 645V742" stroke="#fff" stroke-width="2" stroke-dasharray="4 5"/>
  </g>
  <!-- Ceramic and nozzle: silhouette is a functional symbol, not a dimensional drawing. -->
  <g filter="url(#shadow)"><path d="M627 970H693L681 1000H639Z" fill="#d5e8ee" stroke="#52d7e8" stroke-width="3"/><path d="M639 1000H681L670 1031H650Z" fill="#647b88" stroke="#d8faff" stroke-width="3"/><path d="M650 1031H670L665 1064H655Z" fill="#d58a4a" stroke="#fff0d9" stroke-width="2"/></g>

  <!-- Left callouts -->
  <g class="fa" filter="url(#shadow)">
    <path class="call" d="M623 263H420L393 237"/><circle cx="623" cy="263" r="5" fill="#fff"/>
    <rect x="22" y="196" width="371" height="84" rx="13" fill="#09263c" fill-opacity=".94"/>
    <circle cx="48" cy="222" r="16" fill="#baf7fb"/><text x="48" y="228" text-anchor="middle" class="num">۲</text>
    <text x="370" y="227" text-anchor="end" class="label">شیشهٔ محافظ بالایی</text><text x="370" y="255" text-anchor="end" class="detail en">D24.9 × 1.5 mm · 211LCG0020</text>

    <path class="call" d="M623 574H420L393 533"/><circle cx="623" cy="574" r="5" fill="#fff"/>
    <rect x="22" y="488" width="371" height="84" rx="13" fill="#09263c" fill-opacity=".94"/>
    <circle cx="48" cy="514" r="16" fill="#baf7fb"/><text x="48" y="520" text-anchor="middle" class="num">۴</text>
    <text x="370" y="519" text-anchor="end" class="label">شیشهٔ محافظ میانی</text><text x="370" y="547" text-anchor="end" class="detail en">D27.9 × 4.1 mm · 211LCG0037</text>

    <path class="call" d="M623 877H420L393 836"/><circle cx="623" cy="877" r="5" fill="#fff"/>
    <rect x="22" y="792" width="371" height="84" rx="13" fill="#09263c" fill-opacity=".94"/>
    <circle cx="48" cy="818" r="16" fill="#baf7fb"/><text x="48" y="824" text-anchor="middle" class="num">۶</text>
    <text x="370" y="823" text-anchor="end" class="label">شیشهٔ محافظ پایینی</text><text x="370" y="851" text-anchor="end" class="detail en">D27.9 × 4.1 mm · 211LCG0037</text>
  </g>

  <!-- Right callouts -->
  <g class="fa" filter="url(#shadow)">
    <path class="call" d="M687 124H841L862 150"/><circle cx="687" cy="124" r="5" fill="#fff"/>
    <rect x="862" y="112" width="370" height="68" rx="13" fill="#09263c" fill-opacity=".94"/>
    <circle cx="888" cy="146" r="16" fill="#baf7fb"/><text x="888" y="152" text-anchor="middle" class="num">۱</text>
    <text x="1207" y="152" text-anchor="end" class="label">رابط فیبر QBH</text>

    <path class="call" d="M701 385H841L862 407"/><circle cx="701" cy="385" r="5" fill="#fff"/>
    <rect x="862" y="370" width="370" height="84" rx="13" fill="#09263c" fill-opacity=".94"/>
    <circle cx="888" cy="396" r="16" fill="#baf7fb"/><text x="888" y="402" text-anchor="middle" class="num">۳</text>
    <text x="1207" y="401" text-anchor="end" class="label">مجموعهٔ کولیمیشن ترکیبی</text><text x="1207" y="429" text-anchor="end" class="detail">تعداد و آرایش عدسی‌ها شماتیک است</text>

    <path class="call" d="M701 695H841L862 720"/><circle cx="701" cy="695" r="5" fill="#fff"/>
    <rect x="862" y="676" width="370" height="96" rx="13" fill="#09263c" fill-opacity=".94"/>
    <circle cx="888" cy="702" r="16" fill="#baf7fb"/><text x="888" y="708" text-anchor="middle" class="num">۵</text>
    <text x="1207" y="707" text-anchor="end" class="label">مجموعهٔ فوکوس و محرک</text><text x="1207" y="735" text-anchor="end" class="detail">حرکت خودکار لنز فوکوس تا ۲۲ mm</text><text x="1207" y="758" text-anchor="end" class="detail">موتور سروو بیرونی؛ موقعیت دقیق ترسیم نشده</text>

    <path class="call" d="M681 1015H841L862 1040"/><circle cx="681" cy="1015" r="5" fill="#fff"/>
    <rect x="862" y="1002" width="370" height="68" rx="13" fill="#09263c" fill-opacity=".94"/>
    <circle cx="888" cy="1036" r="16" fill="#baf7fb"/><text x="888" y="1042" text-anchor="middle" class="num">۷</text>
    <text x="1207" y="1042" text-anchor="end" class="label">مجموعهٔ سرامیک و نازل</text>
  </g>

  <g filter="url(#shadow)"><rect x="24" y="1140" width="1206" height="86" rx="14" fill="#09263c" fill-opacity=".96"/><text x="1204" y="1175" text-anchor="end" class="fa" font-size="18" font-weight="700" fill="#fff">مسیر پرتو و ترتیب ماژول‌ها بر اساس دفترچهٔ BM110 V2.0</text><text x="1204" y="1204" text-anchor="end" class="fa" font-size="14" fill="#d4f6fb">جایگاه‌ها و فواصل شماتیک‌اند؛ این تصویر نقشهٔ مونتاژ یا تأیید نسخهٔ نصب‌شده نیست.</text></g>
</svg>

