  <text x="1805" y="986" text-anchor="end" font-size="17" fill="#805a2c" class="fa">تصویر فقط مرجع خانوادهٔ دستگاه است؛ مدل 4020 و همهٔ اعداد باید با نقشه/اندازه‌برداری محصول واقعی تطبیق داده شوند. نقشهٔ ساخت نیست.</text>
