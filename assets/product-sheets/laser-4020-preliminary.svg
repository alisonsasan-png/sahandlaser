<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">پیش‌نمونهٔ تصویری دستگاه برش لیزر تک‌میز استاندارد 4020</title>
  <desc id="desc">تصویر مرجعِ خانوادهٔ سایز سفارشی. ابعاد کلی و محدودهٔ کاری درج‌شده تقریبی و مقدماتی هستند: ۵۲۰۰ در ۳۲۰۰ در ۱۸۰۰ میلی‌متر و محدودهٔ کاری ۴۰۰۰ در ۲۰۰۰ میلی‌متر. نقشهٔ تأییدشده یا ساخت نیست.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4f8fb"/><stop offset="1" stop-color="#eaf1f6"/></linearGradient>
    <linearGradient id="navy" x2="0" y2="1"><stop stop-color="#173955"/><stop offset="1" stop-color="#10283f"/></linearGradient>
    <filter id="shadow" x="-.1" y="-.1" width="1.2" height="1.25"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#183752" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#10a7c7"/></marker>
    <style>text{font-family:Tahoma,Arial,sans-serif;fill:#17334b}.fa{direction:rtl;unicode-bidi:plaintext}.en{font-family:Arial,sans-serif;letter-spacing:.08em}</style>
  </defs>
