<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview 34 — محصولات سهند لیزر</title>
<style>
:root{--tint:#2f7bd8;--ink:#101828;--muted:#667085;--paper:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Tahoma,Arial,sans-serif}.hero{min-height:100vh;display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:28px;align-items:center;padding:clamp(24px,5vw,80px);overflow:hidden;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--tint) 22%,white),transparent 42%),var(--paper)}.copy{max-width:370px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:#667085}.copy h1{font-size:clamp(38px,5vw,78px);line-height:1.05;margin:14px 0 22px;letter-spacing:-.06em}.copy p{color:var(--muted);line-height:1.9}.stage{position:relative;min-height:520px;display:grid;place-items:center}.stage:before{content:"";position:absolute;inset:12% -12%;background:var(--tint);filter:blur(80px);opacity:.22;border-radius:50%}.machine{position:relative;z-index:2;width:min(100%,680px);filter:drop-shadow(0 30px 20px #0002);cursor:zoom-in}.machine img{width:100%;height:360px;object-fit:contain;display:block;background:#fff;border-radius:22px}.reflection{position:absolute;z-index:1;width:72%;height:18%;bottom:10%;border-radius:50%;background:#0003;filter:blur(25px);transform:scaleY(.35)}.panel{background:#fff;border-radius:24px;padding:26px;box-shadow:0 18px 60px #0001}.panel h2{font-size:25px;margin:10px 0}.price{font-size:25px;font-weight:700;margin:16px 0;color:#0b4a8b}.specs{border-top:1px solid #e4e7ec;margin-top:16px}.specs div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eef1f5;font-size:13px}.specs span:first-child{color:#667085}.variants,.gallery{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.variants button{border:1px solid #d0d5dd;background:#fff;border-radius:999px;padding:10px 13px;cursor:pointer}.variants button.active{background:#0b4a8b;color:#fff}.gallery img{width:58px;height:58px;object-fit:cover;border-radius:10px;border:1px solid #d0d5dd;cursor:pointer}.action{width:100%;border:0;background:#0b4a8b;color:#fff;padding:15px;border-radius:999px;font-weight:700;cursor:pointer}.tabs{display:flex;gap:8px;margin-top:16px}.tabs button{border:0;background:#eef4fb;border-radius:8px;padding:8px;cursor:pointer}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:12px 20px;border-radius:99px;opacity:0}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:10}.modal img{max-width:90vw;max-height:85vh}.modal button{position:absolute;top:20px;right:24px;font-size:30px;color:#fff;background:none;border:0}@media(max-width:900px){.hero{grid-template-columns:1fr;text-align:center}.copy{margin:auto}.panel{max-width:440px;margin:auto}.stage{min-height:360px}.specs div{font-size:12px;}}
</style></head><body>
<main class="hero"><section class="copy"><div class="eyebrow">Preview 34 · Sahand Laser</div><h1>دستگاه‌های<br>لیزر سهند</h1><p>نمایش تعاملی محصولات سهند لیزر با همان الگوی تغییر مدل، گالری، بزرگ‌نمایی و مشخصات فنی؛ این صفحه مستقل از Preview 33 است.</p><div class="variants" id="variants"></div></section>
<section class="stage"><div class="reflection"></div><div class="machine" id="machine"><img id="mainImg" alt=""></div></section>
<section class="panel"><div class="eyebrow">محصول منتخب</div><h2 id="name"></h2><div id="category" class="eyebrow"></div><div class="price" id="price"></div><div class="specs" id="specs"></div><div class="tabs"><button data-view="main">عکس اصلی</button><button data-view="dimension">نقشه ابعادی</button><button data-view="xray">ایکس‌ری</button></div><div class="gallery" id="gallery"></div><button class="action" id="info">استعلام قیمت و اطلاعات فنی</button></section></main>
<div class="toast" id="toast">درخواست شما ثبت شد</div><div class="modal" id="modal"><button id="close">×</button><img id="zoomImg" alt=""></div>
<script>
const base="https://raw.githubusercontent.com/alisonsasan-png/sahandlaser/main/reference/product-media/";
const products=[
{code:"CUT-3015-2",name:"دستگاه برش لیزر فایبر DZ3015H",category:"دستگاه برش لیزر",main:base+"CUT-3015-2/003.jpg",dimension:base+"CUT-3015-2/004.png",xray:base+"CUT-3015-2/006.png",price:"بر اساس توان و آپشن",specs:[["ابعاد میز کار","1500 × 3000 میلی‌متر"],["توان لیزر","1000 تا 6000 وات"],["نوع دستگاه","برش ورق"]]},
{code:"DZ3015E",name:"دستگاه برش لیزر کابین‌دار DZ3015E",category:"برش لیزر کابین‌دار",main:base+"DZ3015E/015.jpg",dimension:base+"DZ3015E/016.png",xray:base+"DZ3015E/015.jpg",price:"استعلام قیمت",specs:[["ابعاد میز کار","1500 × 3000 میلی‌متر"],["ساختار","کابین‌دار"],["کاربری","برش ایمن ورق فلزی"]]},
{code:"DZT3015T",name:"دستگاه برش ورق و لوله DZT3015T",category:"برش ورق و لوله",main:base+"DZT3015T/018.jpg",dimension:base+"DZT3015T/019.png",xray:base+"DZT3015T/018.jpg",price:"استعلام قیمت",specs:[["محدوده برش ورق","1500 × 3000 میلی‌متر"],["قابلیت اضافه","برش لوله"],["نوع محصول","دستگاه ترکیبی"]]}
];
let active=0,view="main";const $=id=>document.getElementById(id),main=$("mainImg"),machine=$("machine");
function currentSrc(){const p=products[active];return p[view]||p.main}
function render(){const p=products[active];$("name").textContent=p.name;$("category").textContent=p.category;$("price").textContent=p.price;main.src=currentSrc();main.alt=p.name;$("specs").innerHTML=p.specs.map(x=>`<div><span>${x[0]}</span><b>${x[1]}</b></div>`).join("");$("variants").innerHTML=products.map((x,i)=>`<button class="${i===active?"active":""}" data-i="${i}">${x.code}</button>`).join("");$("gallery").innerHTML=[p.main,p.dimension,p.xray].map((s,i)=>`<img src="${s}" data-src="${s}" alt="نمای ${i+1}">`).join("");document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{active=+b.dataset.i;view="main";swap()});document.querySelectorAll("[data-src]").forEach(b=>b.onclick=()=>{main.src=b.dataset.src});document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{view=b.dataset.view;main.src=currentSrc()})}
function swap(){if(window.gsap)gsap.fromTo(machine,{y:18,opacity:.5,scale:.97},{y:0,opacity:1,scale:1,duration:.55,ease:"back.out(1.5)"});render()}
$("machine").onclick=()=>{$("zoomImg").src=main.src;$("modal").style.display="grid"};$("close").onclick=()=>$("modal").style.display="none";$("info").onclick=()=>{const t=$("toast");if(window.gsap)gsap.fromTo(t,{opacity:0,y:12},{opacity:1,y:0,duration:.25,yoyo:true,repeat:1,repeatDelay:1});else t.style.opacity=1};render();
</script><script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script></body></html>
