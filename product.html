<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صفحه محصول | سهند لیزر</title><style>:root{--navy:#102b43;--cyan:#13a6c4;--bg:#f4f7f9;--ink:#17334b;--line:#dbe4ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.9 Tahoma,Arial,sans-serif}.wrap{width:min(1280px,100%);margin:auto;padding:24px 20px 55px}.heading{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:18px}.heading h1{margin:0;color:var(--navy);font-size:clamp(24px,4vw,38px);line-height:1.4}.code{direction:ltr;color:#60778b;font-size:14px}.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(330px,.85fr);gap:22px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 20px #102b4310}.main-image{display:block;width:100%;height:min(520px,55vw);min-height:300px;object-fit:contain;background:#f8fbfd;border-radius:12px}.category{display:inline-block;border-radius:999px;padding:2px 11px;background:#e8f7fa;color:#126179;font-size:13px;margin-bottom:9px}.desc{color:#536b80;margin:8px 0 16px}.specs{width:100%;border-collapse:collapse;font-size:14px}.specs tr{border-bottom:1px solid #edf1f4}.specs th,.specs td{padding:8px 6px;text-align:right;vertical-align:top}.specs th{width:42%;color:#536b80;font-weight:700}.specs td{direction:ltr;text-align:left;color:#17334b}.section{margin-top:24px}.section h2{font-size:22px;color:var(--navy);margin:0 0 10px;border-bottom:2px solid var(--cyan);padding-bottom:7px}.technical-image{display:block;width:100%;max-height:760px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:12px}.notice{padding:12px 14px;background:#fff7eb;border:1px solid #ead3a5;border-radius:10px;color:#795b27;font-size:14px}.missing{padding:28px;text-align:center;color:#60778b;background:#f8fbfd;border:1px dashed #cbd8e2;border-radius:12px}.error{max-width:700px;margin:60px auto;padding:30px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:15px}@media(max-width:800px){.layout{grid-template-columns:1fr}.wrap{padding-inline:14px}.topin{align-items:flex-start;flex-direction:column}.main-image{height:60vw;min-height:240px}}</style></head><body><main id="app" class="wrap"></main><script>(()=>{const code=new URLSearchParams(location.search).get('code')||'';const app=document.getElementById('app');const labels={cutting:'دستگاه برش لیزر',welding:'دستگاه جوش لیزر',marking:'دستگاه حکاکی و مارکینگ',cleaning:'دستگاه تمیزکاری لیزر',source:'سورس لیزر',head:'هد و کنترلر',parts:'قطعات و تجهیزات',consumables:'قطعات مصرفی'};const drawingCodes=['CUT-3015-1','ML-001','ML-002','ML-005','DZT3015T','DZT6020T','DZ3015E','DW3015','DC3000','SPLIT-MARK','LR30','LG60'];const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;return n};const safe=(x)=>String(x??'');fetch('docs/catalog-completion/catalog-draft.json',{cache:'no-cache'}).then(r=>r.json()).then(raw=>{const items=Array.isArray(raw)?raw:raw.products;const p=items.find(x=>x.code===code);if(!p){app.innerHTML='<div class="error">محصول پیدا نشد.<br><a href="catalog.html">بازگشت به کاتالوگ</a></div>';return}const name=p.name||p.code;document.title=name+' | سهند لیزر';const visual=p.visuals?.studio?.src||p.images?.find(x=>x?.src)?.src;const main=el('section','panel');if(visual){const img=el('img','main-image');img.src=visual;img.alt='تصویر اصلی '+name;main.append(img)}else main.append(el('div','missing','تصویر اصلی برای این محصول ثبت نشده است.'));const info=el('section','panel');info.append(el('span','category',labels[p.category]||p.category||'محصول'));const heading=el('div','heading');const h=el('h1','',name);const c=el('div','code',p.code||'');heading.append(h,c);info.append(heading);const desc=Array.isArray(p.description)?p.description.join(' '):p.description;if(desc)info.append(el('p','desc',desc));const table=el('table','specs');for(const s of (p.specs||[])){const tr=el('tr');tr.append(el('th','',s.label||'مشخصه'),el('td','',s.value||'—'));table.append(tr)}info.append(table);const layout=el('div','layout');layout.append(main,info);app.append(layout);const d=el('section','section');d.append(el('h2','', 'نقشه ابعادی'));if(drawingCodes.includes(p.code)){const img=el('img','technical-image');img.src='assets/product-drawings/'+p.code+'-artline.svg';img.alt='نقشه ابعادی Art-Line '+p.code;d.append(img)}else d.append(el('div','missing','نقشه ابعادی اختصاصی این مدل هنوز ثبت نشده است.'));app.append(d);const x=el('section','section');x.append(el('h2','', 'X‑Ray / نمای داخلی'));if(['cutting','marking'].includes(p.category)){const img=el('img','technical-image');img.src=p.category==='cutting'?'assets/xray/fiber-cutting-xray.svg':'assets/xray/fiber-marking-xray.svg';img.alt='X-Ray شماتیک '+p.code;x.append(img)}else x.append(el('div','missing','برای این گروه محصول X‑Ray تعریف نشده است.'));app.append(x);if(['LR30','LG60'].includes(p.code))app.append(el('p','notice','نقشه‌ی این مدل در حال حاضر مرجع اولیه است و ابعاد کلی کارخانه‌ای نیاز به تأیید دارد.'))}).catch(()=>{app.innerHTML='<div class="error">داده‌های محصول بارگیری نشد. لطفاً صفحه را دوباره تازه‌سازی کنید.</div>'})})()</script></body></html>
