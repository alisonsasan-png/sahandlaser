<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صفحه محصول | سهند لیزر</title><style>*{box-sizing:border-box}html,body{margin:0;background:#07101f;color:#fff;font-family:Tahoma,Arial,sans-serif}.banner{height:300px;position:relative;overflow:hidden;background:#061326}.bannerImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:brightness(.58) saturate(1.22) contrast(1.08)}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#020814ee,#06132655,#020814b8);z-index:1}.gridlight{position:absolute;z-index:2;inset:-40%;background:repeating-linear-gradient(112deg,transparent 0 68px,#51ddff2c 70px 72px);transform:rotate(-7deg);mix-blend-mode:screen}.glow{position:absolute;z-index:3;inset:0;background:radial-gradient(ellipse at 70% 45%,#27dcff88,transparent 28%),radial-gradient(ellipse at 18% 40%,#168dde66,transparent 34%);mix-blend-mode:screen;pointer-events:none}.scan{position:absolute;z-index:4;top:-15%;bottom:-15%;right:-15px;width:8px;background:#b9f8ff;box-shadow:0 0 18px 9px #20dfff,0 0 70px 28px #159cde;animation:scan 4s linear infinite}.copy{position:relative;z-index:5;width:min(1180px,calc(100% - 40px));height:100%;margin:auto;display:flex;align-items:center}.copy h1{font-size:clamp(1.7rem,4vw,3.4rem);line-height:1.35;margin:0;text-shadow:0 3px 20px #000}.copy p{color:#e0f2fa;line-height:2}.main{height:calc(100vh - 300px);background:#f7f9fc}.main iframe{display:block;width:100%;height:100%;border:0}@keyframes scan{from{right:-20%}to{right:120%}}@media(max-width:640px){.banner{height:240px}.main{height:calc(100vh - 240px)}.copy h1{font-size:1.8rem}.copy p{font-size:.8rem}}</style></head><body><section class="banner"><img class="bannerImg" src="https://sahandlaser.com/wp-content/uploads/2025/08/first-baner-1_807400-1536x800.jpg" alt="سهند لیزر"><div class="shade"></div><div class="gridlight"></div><div class="glow">
