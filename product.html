<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جزئیات محصول | سهند لیزر</title><style>:root{--navy:#102b43;--cyan:#13a6c4;--bg:#f3f6f8;--ink:#17334b;--line:#dbe4ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.9 Tahoma,Arial,sans-serif}.hero{background:linear-gradient(125deg,#102b43,#1c4963);color:#fff;padding:28px 20px;border-bottom:4px solid var(--cyan)}.wrap{width:min(1200px,100%);margin:auto;padding-inline:20px}.hero h1{margin:0;font-size:clamp(25px,4vw,38px)}.hero p{margin:5px 0;color:#d4e9ef}.nav{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.nav a,.btn{display:inline-block;padding:7px 12px;border-radius:9px;text-decoration:none;border:1px solid #9acbd5;color:#fff;background:#126179}.nav a.alt{background:#fff;color:#126179}.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:20px;padding:24px 0 50px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 20px #102b4310}.visual{width:100%;max-height:520px;object-fit:contain;border-radius:12px;background:#f8fbfd}.tag{display:inline-block;border-radius:999px;padding:2px 10px;background:#e8f7fa;color:#126179;font-size:13px}.code{direction:ltr;text-align:right;color:#60778b;font-size:14px}.specs{list-style:none;margin:12px 0;padding:0}.specs li{padding:8px 0;border-bottom:1px solid #edf1f4}.specs strong{color:#17334b}.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.links a{color:#126179;background:#eef9fb;border:1px solid #bfe2e8;border-radius:9px;padding:7px 10px;text-decoration:none}.notice{margin-top:15px;padding:12px;background:#fff7eb;border:1px solid #ead3a5;border-radius:10px;color:#795b27;font-size:14px}.error{padding:30px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:15px}@media(max-width:760px){.layout{grid-template-columns:1fr}.wrap{padding-inline:14px}}</style></head><body><header class="hero"><div class="wrap"><h1 id="title">جزئیات محصول</h1><p id="subtitle">سهند لیزر</p><nav class="nav"><a class="alt" href="catalog.html">بازگشت به کاتالوگ</a><a href="drawings.html">گالری نقشه‌ها</a><a href="previews.html">پیش‌نمایش‌ها</a></nav></div></header><main class="wrap"><div id="app" class="layout"></div></main><script>(()=>{const code=new URLSearchParams(location.search).get('code')||'';const app=document.getElementById('app'),title=document.getElementById('title'),sub=document.getElementById('subtitle');const labels={cutting:'دستگاه برش لیزر',welding:'دستگاه جوش لیزر',marking:'دستگاه حکاکی و مارکینگ',cleaning:'دستگاه تمیزکاری لیزر',source:'سورس لیزر',head:'هد و کنترلر',parts:'قطعات و تجهیزات',consumables:'قطعات مصرفی'};const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;return n};const esc=x=>String(x??'');fetch('docs/catalog-completion/catalog-draft.json',{cache:'no-cache'}).then(r=>r.json()).then(raw=>{const items=Array.isArray(raw)?raw:raw.products;const p=items.find(x=>x.code===code);if(!p){app.innerHTML='<div class="error">محصول پیدا نشد. <a href="catalog.html">بازگشت به کاتالوگ</a></div>';return}const visual=p.visuals?.studio?.src||p.images?.find(x=>x?.src)?.src;title.textContent=p.name||p.code;sub.textContent=(p.code||'')+' — '+(labels[p.category]||p.category||'محصول');const left=el('section','panel');if(visual){const img=el('img','visual');img.src=visual;img.alt='تصویر '+(p.name||p.code);left.append(img)}else left.append(el('div','error','تصویر اختصاصی در رکورد این محصول ثبت نشده است.'));const right=el('section','panel');right.append(el('span','tag',labels[p.category]||p.category||'محصول'),el('div','code',p.code||''));const desc=Array.isArray(p.description)?p.description.join(' '):p.description;if(desc)right.append(el('p','',desc));const ul=el('ul','specs');for(const s of (p.specs||[])){const li=el('li');li.append(el('strong','',(s.label||'مشخصه')+': '),document.createTextNode(s.value||'—'));ul.append(li)}right.append(ul);const links=el('div','links');if(['cutting','marking'].includes(p.category)){const a=el('a','', 'نمای X‑Ray / نمای داخلی شماتیک');a.href=p.category==='cutting'?'assets/xray/fiber-cutting-xray.svg':'assets/xray/fiber-marking-xray.svg';a.target='_blank';links.append(a)}if(['CUT-3015-1','ML-001','ML-002','ML-005','DZT3015T','DZT6020T','DZ3015E','DW3015','DC3000','SPLIT-MARK','LR30','LG60'].includes(p.code)){const a=el('a','', 'نقشه Art‑Line سه‌نما');a.href='assets/product-drawings/'+p.code+'-artline.svg';a.target='_blank';links.append(a)}for(const s of (p.sources||[]).slice(0,4)){if(s.url){const a=el('a','',s.title||'منبع فنی');a.href=s.url;a.target='_blank';a.rel='noopener';links.append(a)}}right.append(links);if(['LR30','LG60'].includes(p.code))right.append(el('div','notice','این نقشه در حال حاضر مرجع اولیه است؛ ابعاد کلی کارخانه‌ای نیاز به تأیید دارد.'));app.append(left,right);}).catch(()=>{app.innerHTML='<div class="error">داده‌ی محصول بارگیری نشد. لطفاً دوباره تلاش کنید.</div>'})})()</script></body></html>
