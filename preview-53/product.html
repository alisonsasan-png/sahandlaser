<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محصول | پیش‌نمایش ۵۳</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17213b;font-family:Tahoma,Arial,sans-serif;line-height:1.8}a{color:inherit;text-decoration:none}.top{background:#14234a;color:#fff}.wrap{max-width:1320px;margin:auto;padding:0 20px}.nav{height:70px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-weight:800;font-size:20px}.brand small{display:block;font-size:9px;letter-spacing:3px;color:#b9c7ef}.navlinks{display:flex;gap:12px;flex-wrap:wrap}.navlinks a{padding:7px 12px;border-radius:8px}.navlinks a:hover{background:#ffffff1a}.hero{padding:48px 0 34px;background:linear-gradient(135deg,#14234a,#1e5d83);color:#fff}.hero h1{font-size:clamp(28px,4vw,48px);line-height:1.3;margin:10px 0}.hero p{max-width:760px;color:#d8e6f7}.eyebrow{color:#e5b898;font-size:12px;font-weight:700}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.chip,.filter{border:1px solid #b7c4db;background:#fff;color:#27395f;border-radius:999px;padding:8px 15px;cursor:pointer}.chip.active,.filter.active{background:#1e2a5e;color:#fff;border-color:#1e2a5e}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:24px 0}.search{border:1px solid #c9d2e3;border-radius:12px;padding:12px 15px;min-width:280px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-bottom:42px}.card{background:#fff;border:1px solid #dbe3f0;border-radius:18px;overflow:hidden;box-shadow:0 8px 25px #14234a0c}.card img{width:100%;aspect-ratio:16/10;object-fit:contain;background:#fff;display:block}.cardbody{padding:15px}.card h3{margin:5px 0;font-size:18px}.meta{color:#65718b;font-size:12px}.btn{display:inline-block;background:#a61c1c;color:#fff;border:0;border-radius:10px;padding:9px 14px;margin-top:12px;cursor:pointer}.detail{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;padding:34px 0}.compare{position:relative;aspect-ratio:3/2;overflow:hidden;border-radius:18px;background:#e8eef6;user-select:none;touch-action:pan-y}.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.compare .xr{clip-path:inset(0 calc(100% - var(--reveal,50%)) 0 0)}.scan{position:absolute;left:var(--reveal,50%);top:0;bottom:0;width:3px;background:#18b9d4;box-shadow:0 0 15px #18b9d4;pointer-events:none}.scan i{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:#173e62;color:#fff;display:grid;place-items:center;font-style:normal}.info{background:#fff;border-radius:18px;padding:24px;border:1px solid #dbe3f0}.info h1{line-height:1.35;margin-top:4px}.drawing{margin:12px 0;background:#fff;border:1px solid #dbe3f0;border-radius:14px;padding:10px}.drawing img{width:100%;max-height:360px;object-fit:contain}.note{font-size:12px;color:#65718b}.back{display:inline-block;margin-top:20px;color:#1e5d83;font-weight:700}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detail{grid-template-columns:1fr}.navlinks{display:none}}@media(max-width:560px){.grid{grid-template-columns:1fr}.wrap{padding:0 12px}.hero{padding-top:32px}.search{min-width:100%;width:100%}.detail{padding-top:20px}}</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="./">سهند لیزر<small>PRODUCT DETAIL</small></a><a href="./">بازگشت به محصولات</a></div></header><main class="wrap"><div id="app"></div></main><script src="./data.js"></script><script>const P=window.PREVIEW53_PRODUCTS||[],id=Number(new URLSearchParams(location.search).get('id'))||1,p=P.find(x=>x.number===id)||P[0],app=document.querySelector('#app');document.title=p.name+' | پیش‌نمایش ۵۳';app.innerHTML='<section class="detail"><div><div class="compare" id="cmp"><img src="../'+p.image+'" alt="'+p.name+'"><img class="xr" src="../'+p.xray+'" alt="X-Ray '+p.name+'"><div class="scan"><i>‹›</i></div></div><p class="note">با موس یا انگشت روی تصویر بکشید تا بین نمای اصلی و X-Ray جابه‌جا شوید.</p></div><article class="info"><span class="eyebrow">'+p.code+' · '+p.category+'</span><h1>'+p.name+'</h1><p>'+p.description+'</p><div class="drawing"><strong>نقشه ابعادی / مرجع خانواده</strong><img src="../assets/product-drawings/'+p.drawing+'" alt="نقشه ابعادی '+p.name+'"></div><p class="note">این نقشه برای شناخت ابعاد خانواده است؛ ابعاد نسخه‌ی نهایی باید با سازنده تأیید شود.</p><a class="back" href="./">← بازگشت به فهرست محصولات</a></article></section>';const cmp=document.querySelector('#cmp');let drag=false;function move(e){const r=cmp.getBoundingClientRect(),x=e.clientX??(e.touches&&e.touches[0].clientX);if(x!=null){const v=Math.max(0,Math.min(100,(x-r.left)/r.width*100));cmp.style.setProperty('--reveal',v+'%')}}cmp.addEventListener('pointerdown',e=>{drag=true;cmp.setPointerCapture(e.pointerId);move(e)});cmp.addEventListener('pointermove',e=>{if(drag)move(e)});cmp.addEventListener('pointerup',()=>drag=false);cmp.addEventListener('pointercancel',()=>drag=false);</script></body></html>
