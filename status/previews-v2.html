<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>فهرست پیش‌نمایش‌های سهند لیزر</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f1f4f7;color:#183044;font:16px Tahoma,Arial,sans-serif;line-height:2}
    main{max-width:900px;margin:auto;padding:28px}section{background:#fff;border:1px solid #dce4eb;border-radius:16px;padding:24px;margin-bottom:18px}
    h1,h2{margin-top:0}nav{display:flex;flex-wrap:wrap;gap:10px}a{display:inline-block;color:#176c68;border:1px solid #c6dedb;border-radius:9px;padding:8px 14px;text-decoration:none;background:#fbfefe}a:hover{background:#eaf6f4}small{color:#657486}
  </style>
</head>
<body>
  <main>
    <section><h1>پیش‌نمایش‌های مستقل سهند لیزر</h1><p>نسخه‌های دسته‌بندی و طراحی را از اینجا باز کنید.</p><p><small>آخرین ممیزی مرورگر: پیش‌نمایش‌های ۱۲ تا ۲۸، بدون iframe.</small></p></section>
    <section><h2>نسخه‌های دسته‌بندی</h2><nav id="taxonomy"></nav></section>
    <section><h2>نسخه‌های تم و تعامل</h2><nav id="themes"></nav></section>
  </main>
  <script>
    function links(id,first,last){const nav=document.getElementById(id);for(let n=first;n<=last;n++){const a=document.createElement('a');a.href='../preview-'+n+'/';a.textContent='پیش‌نمایش '+n;nav.append(a)}}
    links('taxonomy',12,24);links('themes',25,28);
  </script>
</body>
</html>
