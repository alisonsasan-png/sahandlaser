<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1400" viewBox="0 0 1920 1400" role="img" aria-labelledby="title desc">
  <title id="title">نقشهٔ ایزومتریک و ابعادی دستگاه برش لیزر تک‌میز استاندارد 3015</title>
  <desc id="desc">رندر ایزومتریک براساس تصاویر ارسالی، به‌همراه ابعاد کلی طول ۴۸۰۰، عرض ۲۴۰۰ و ارتفاع ۱۷۵۰ میلی‌متر. نماهای پایین شماتیک و غیرساختی هستند.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15395a"/><stop offset="1" stop-color="#0b2038"/></linearGradient>
    <linearGradient id="pale" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8fbfd"/><stop offset="1" stop-color="#edf4f8"/></linearGradient>
    <filter id="shadow" x="-.1" y="-.1" width="1.2" height="1.25"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#183752" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#0785bd"/></marker>
    <style>
      text{font-family:Tahoma,Arial,sans-serif;fill:#17334b}
      .en{font-family:Arial,sans-serif;letter-spacing:.045em}
      .title{font-size:42px;font-weight:800}
      .subtitle{font-size:19px;fill:#60778b}
      .light{fill:#fff}.light-blue{fill:#8fe0f2}.light-muted{fill:#c9dbe6}.warm{fill:#76552e}
      .section{font-size:25px;font-weight:700}
      .label{font-size:19px;font-weight:700}
      .dim{font-size:24px;font-weight:800;fill:#087eaf}
      .line{stroke:#0785bd;stroke-width:2.5;fill:none}
      .machine{fill:#f7fafc;stroke:#243b50;stroke-width:3}
      .detail{fill:none;stroke:#324e67;stroke-width:3}
    </style>
  </defs>
