<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1400" viewBox="0 0 1920 1400" role="img" aria-labelledby="title desc">
  <title id="title">نقشهٔ ایزومتریک ابعادی دستگاه برش لیزر تک‌میز 3015</title>
  <desc id="desc">تصویرسازی فنی ایزومتریک و نماهای شماتیک دستگاه، بر اساس تصاویر محصول و نقشهٔ ابعادی ارسالی. ابعاد کلی مرجع: طول ۴۸۰۰، عرض ۲۴۰۰ و ارتفاع ۱۷۵۰ میلی‌متر. این نقشه برای معرفی است و نقشهٔ ساخت نیست.</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f5f8fb"/></linearGradient>
    <linearGradient id="blueSide" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#14518b"/><stop offset="1" stop-color="#0b315c"/></linearGradient>
    <linearGradient id="whiteSide" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#dfe6ec"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f8fa"/><stop offset=".48" stop-color="#aebbc6"/><stop offset="1" stop-color="#eef2f5"/></linearGradient>
    <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#26323d"/><stop offset="1" stop-color="#111a23"/></linearGradient>
    <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#1599ed"/><stop offset="1" stop-color="#0867b8"/></linearGradient>
    <pattern id="slats" width="15" height="15" patternTransform="rotate(-24)" patternUnits="userSpaceOnUse"><rect width="7" height="15" fill="#72808b"/><rect x="7" width="8" height="15" fill="#202a34"/></pattern>
    <filter id="shadow" x="-.15" y="-.2" width="1.3" height="1.5"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#17334b" flood-opacity=".14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#087fae"/></marker>
    <style>
      text{font-family:Tahoma,Arial,sans-serif}.en{font-family:Arial,sans-serif;letter-spacing:.035em}.title{font-size:39px;font-weight:800;fill:#17334b}.sub{font-size:18px;fill:#61778a}.section{font-size:24px;font-weight:700;fill:#17334b}.label{font-size:18px;font-weight:700;fill:#17334b}.dim{font-size:22px;font-weight:800;fill:#087fae}.line{fill:none;stroke:#087fae;stroke-width:2.5}.thin{fill:none;stroke:#456074;stroke-width:2}.edge{stroke:#28445b;stroke-width:3;stroke-linejoin:round}
