  <rect x="65" y="1295" width="1790" height="48" rx="12" fill="#fff5e8" stroke="#f0dfc8"/>
  <text x="1825" y="1326" text-anchor="end" font-size="17" font-weight="700" class="fa warm">یادداشت: رندر ایزومتریک بازسازی تصویری است؛ نماهای بالا، جانبی و جلو شماتیک‌اند و جزئیات اجرایی/ابعاد نصب را نشان نمی‌دهند.</text>
