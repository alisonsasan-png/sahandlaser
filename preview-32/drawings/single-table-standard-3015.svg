    <rect x="145" y="145" width="270" height="100" rx="7" class="machine"/><rect x="157" y="157" width="246" height="22" fill="#202a34"/><rect x="164" y="185" width="232" height="46" fill="#123c70"/>
    <path d="M190 245v22m180-22v22M180 267h30m160-30h30" class="detail"/><path d="M255 145V99h53v46m-26-46V80" class="detail" stroke-width="6"/>
