name: Crawl SahandLaser media

on:
  push:
    paths:
      - 'tools/extract_sahand_media.py'
      - 'tools/extract_sahand_media_fast.py'
      - '.github/workflows/crawl-sahand-media.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install crawler dependencies
        run: pip install requests beautifulsoup4

      - name: Crawl current SahandLaser site
        run: python tools/extract_sahand_media_fast.py

      - name: Commit media inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sahandlaser-media-full.json data/sahandlaser-media-full.csv data/sahandlaser-media-report.md
          if ! git diff --cached --quiet; then
            git commit -m "بروزرسانی خودکار بانک کامل عکس‌های سایت فعلی [skip ci]"
            git push
          fi
