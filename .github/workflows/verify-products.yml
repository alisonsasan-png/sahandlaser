name: Verify product viewers

on:
  push:
    branches: [main, work/site-fixes-2026-10-07]
    paths:
      - 'runtime/**'
      - 'styles/**'
      - 'tests/**'
      - 'assets/products/CT-001/**'
      - 'assets/products/CT-010/**'
      - 'index.html'
      - 'package*.json'
      - '.github/workflows/verify-products.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate clean dependency lock
        run: |
          dependency_dir=$(mktemp -d)
          cp package.json "$dependency_dir/"
          (cd "$dependency_dir" && npm install --package-lock-only --ignore-scripts)
          cp "$dependency_dir/package-lock.json" package-lock.json
      - run: npm ci
      - run: npm run build:viewer
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Browser verification
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/product-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/mobile-model.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-viewer-screenshots
          path: |
            test-results/*.png
            package-lock.json
          if-no-files-found: ignore
          retention-days: 7
