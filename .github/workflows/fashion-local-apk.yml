name: Build Fashion Local APK

on:
  push:
    branches:
      - fashion-local-apk-v01
    paths:
      - 'buildsrc/**'
      - '.github/workflows/fashion-local-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Rebuild source archive
        run: |
          cat buildsrc/part00 buildsrc/part01 buildsrc/part02 buildsrc/part03 buildsrc/part04 > FashionLocalAndroid-v0.1.zip.b64
          base64 --decode FashionLocalAndroid-v0.1.zip.b64 > FashionLocalAndroid-v0.1.zip
          unzip -t FashionLocalAndroid-v0.1.zip
          unzip -q -o FashionLocalAndroid-v0.1.zip

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle -p fashion-local :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp fashion-local/app/build/outputs/apk/debug/app-debug.apk FashionLocalAI-v0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FashionLocalAI-v0.1
          path: FashionLocalAI-v0.1.apk
          if-no-files-found: error
