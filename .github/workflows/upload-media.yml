name: Upload media to Pouyasazan
on:
  workflow_dispatch:
    inputs:
      bundle_url:
        description: 'Temporary HTTPS URL of flat media ZIP (no credentials)'
        required: true
        type: string
      bundle_sha256:
        description: 'Expected SHA-256 of media ZIP'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pouyasazan-media
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout upload script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: scripts/upload-media.py
          sparse-checkout-cone-mode: false
      - name: Upload changed media and verify public bytes
        env:
          BUNDLE_URL: ${{ inputs.bundle_url }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
          MEDIA_FTP_HOST: ${{ secrets.MEDIA_FTP_HOST }}
          MEDIA_FTP_USER: ${{ secrets.MEDIA_FTP_USER }}
          MEDIA_FTP_PASSWORD: ${{ secrets.MEDIA_FTP_PASSWORD }}
          MEDIA_FTP_DIRECTORY: ${{ secrets.MEDIA_FTP_DIRECTORY }}
          MEDIA_PUBLIC_BASE_URL: ${{ secrets.MEDIA_PUBLIC_BASE_URL }}
        run: python3 scripts/upload-media.py
