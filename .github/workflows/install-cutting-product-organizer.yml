name: Install cutting product organizer

on:
  push:
    paths:
      - 'assets/update/cutting-product-organizer.js'
      - 'data/cutting-product-registry-2026-10-04.json'
      - '.github/workflows/install-cutting-product-organizer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wire organizer into live index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/update/cutting-product-organizer.js?v=20261004"></script>'
          anchor='<script src="assets/update/site-update-core.js"></script>'
          if tag not in s:
              if anchor not in s:
                  raise SystemExit('site-update-core.js anchor not found')
              s=s.replace(anchor, anchor+'\n'+tag, 1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Commit live wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "فعال‌سازی پرونده یکپارچه محصولات برش [skip ci]"
            git push
          fi
