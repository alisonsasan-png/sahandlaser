name: Install cutting product organizer

on:
  push:
    paths:
      - 'assets/update/cutting-product-organizer.js'
      - 'assets/update/product-asset-viewers.js'
      - 'data/cutting-product-registry-2026-10-04.json'
      - 'data/product-site-master-v1.json'
      - '.github/workflows/install-cutting-product-organizer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wire database organizer and verified asset viewers into index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          anchor='<script src="assets/update/site-update-core.js"></script>'
          organizer='<script src="assets/update/cutting-product-organizer.js?v=20261004b"></script>'
          viewers='<script src="assets/update/product-asset-viewers.js?v=20261004"></script>'
          if anchor not in s:
              raise SystemExit('site-update-core.js anchor not found')
          # normalize old organizer tag to current version
          import re
          s=re.sub(r'<script src="assets/update/cutting-product-organizer\.js\?v=[^"]+"></script>', organizer, s)
          if organizer not in s:
              s=s.replace(anchor, anchor+'\n'+organizer, 1)
          if viewers not in s:
              s=s.replace(organizer, organizer+'\n'+viewers, 1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit live wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "فعال‌سازی زیرساخت رسانه تاییدشده محصولات [skip ci]"
            git push
          fi
